name: Render Soraya Video

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live-URL der App"
        required: true
        default: "https://soraya-web.vercel.app"
      brand:
        description: "Markenname"
        required: true
        default: "SORAYA"
      tagline:
        description: "Slogan"
        required: true
        default: "Deine Sterne. Dein Weg."
      cta:
        description: "Call to Action"
        required: true
        default: "Jetzt entdecken"
      storeLine:
        description: "Store-Zeile"
        required: true
        default: "Ab sofort im Google Play Store"

jobs:
  render:
    name: Render video
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Screenshots der App aufnehmen
        run: npm run shoot
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
      - name: Props bauen
        run: echo "$WORKFLOW_INPUT" > input-props.json
        env:
          WORKFLOW_INPUT: ${{ toJson(github.event.inputs) }}
      - name: Video rendern
        run: npx remotion render SorayaPromo out/soraya.mp4 --props="./input-props.json"
      - uses: actions/upload-artifact@v4
        with:
          name: soraya-video
          path: out/soraya.mp4
